name: Greedy Experiments

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated instance size classes: small,medium,large"
        required: true
        default: "small,medium,large"
      budgets:
        description: "Comma-separated travel budgets"
        required: true
        default: "200,300,500"
      max_instances:
        description: "Maximum number of instances per job; use 0 for all"
        required: true
        default: "0"
      instance_offset:
        description: "Zero-based offset into the sorted instance list"
        required: true
        default: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        uses: actions/github-script@v7
        with:
          script: |
            const split = (value) => value.split(',').map((item) => item.trim()).filter(Boolean);
            const sizes = split('${{ inputs.sizes }}');
            const budgets = split('${{ inputs.budgets }}');
            const allowedSizes = new Set(['small', 'medium', 'large']);
            for (const size of sizes) {
              if (!allowedSizes.has(size)) {
                core.setFailed(`Unsupported size: ${size}`);
                return;
              }
            }
            const include = [];
            for (const size of sizes) {
              for (const budget of budgets) {
                include.push({ size, budget });
              }
            }
            core.setOutput('matrix', JSON.stringify({ include }));

  run-greedy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Greedy batch
        env:
          SIZE: ${{ matrix.size }}
          BUDGET: ${{ matrix.budget }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          INSTANCE_OFFSET: ${{ inputs.instance_offset }}
        run: |
          set -euo pipefail
          COLLECTION="planar_weighted_${SIZE}"
          SOURCE_DIR="datasets/${COLLECTION}"
          INPUT_DIR="${SOURCE_DIR}"
          if [[ "${MAX_INSTANCES}" != "0" ]]; then
            SUBSET_DIR="${RUNNER_TEMP}/${COLLECTION}_offset${INSTANCE_OFFSET}_max${MAX_INSTANCES}"
            mkdir -p "${SUBSET_DIR}"
            SOURCE_DIR="${SOURCE_DIR}" SUBSET_DIR="${SUBSET_DIR}" MAX_INSTANCES="${MAX_INSTANCES}" INSTANCE_OFFSET="${INSTANCE_OFFSET}" python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source_dir = Path(os.environ["SOURCE_DIR"])
          subset_dir = Path(os.environ["SUBSET_DIR"])
          max_instances = int(os.environ["MAX_INSTANCES"])
          instance_offset = int(os.environ["INSTANCE_OFFSET"])
          if max_instances < 0:
              raise SystemExit("max_instances must be non-negative")
          if instance_offset < 0:
              raise SystemExit("instance_offset must be non-negative")

          files = sorted(path for path in source_dir.iterdir() if path.is_file() and not path.name.startswith("."))
          selected = files[instance_offset:instance_offset + max_instances]
          if not selected:
              raise SystemExit("No instances selected for this batch")
          for path in selected:
              shutil.copy2(path, subset_dir / path.name)
          print(f"Selected {len(selected)} instances from {source_dir} starting at offset {instance_offset}")
          PY
            INPUT_DIR="${SUBSET_DIR}"
          fi
          RUN_DIR="${COLLECTION}_${BUDGET}"
          python3 approaches/greedy/index.py \
            --input "${INPUT_DIR}" \
            --output "results/${RUN_DIR}" \
            --metadata-output "results_metadata/greedy/${RUN_DIR}" \
            --budget "${BUDGET}"

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: greedy-${{ matrix.size }}-b${{ matrix.budget }}-offset${{ inputs.instance_offset }}-max${{ inputs.max_instances }}
          path: |
            results/
            results_metadata/greedy/
          if-no-files-found: error
          retention-days: 14
