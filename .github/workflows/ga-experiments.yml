name: GA Experiments

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated instance size classes: small,medium,large"
        required: true
        default: "small,medium,large"
      collections:
        description: "Optional comma-separated dataset collections under datasets/, for example euclidean_scenarios/ring"
        required: false
        default: ""
      budgets:
        description: "Comma-separated travel budgets"
        required: true
        default: "50,100,200,300"
      seeds:
        description: "Comma-separated random seeds"
        required: true
        default: "1,2,3"
      generations:
        description: "GA generations"
        required: true
        default: "100"
      population_size:
        description: "GA population size"
        required: true
        default: "50"
      mutation_rate:
        description: "GA mutation rate"
        required: true
        default: "0.1"
      max_instances:
        description: "Maximum number of instances per job; use 0 for all"
        required: true
        default: "0"
      instance_offset:
        description: "Zero-based offset into the sorted instance list"
        required: true
        default: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        uses: actions/github-script@v7
        with:
          script: |
            const split = (value) => value.split(',').map((item) => item.trim()).filter(Boolean);
            const sizes = split('${{ inputs.sizes }}');
            const requestedCollections = split('${{ inputs.collections }}');
            const budgets = split('${{ inputs.budgets }}');
            const seeds = split('${{ inputs.seeds }}');

            let collections = [];
            if (requestedCollections.length) {
              for (const collection of requestedCollections) {
                if (collection.startsWith('/') || collection.includes('..')) {
                  core.setFailed(`Unsupported collection path: ${collection}`);
                  return;
                }
                collections.push({ collection, collection_label: collection.replaceAll('/', '_') });
              }
            } else {
              const allowedSizes = new Set(['small', 'medium', 'large']);
              for (const size of sizes) {
                if (!allowedSizes.has(size)) {
                  core.setFailed(`Unsupported size: ${size}`);
                  return;
                }
                const collection = `euclidean_complete_${size}`;
                collections.push({ collection, collection_label: collection });
              }
            }

            const include = [];
            for (const collection of collections) {
              for (const budget of budgets) {
                for (const seed of seeds) {
                  include.push({ ...collection, budget, seed });
                }
              }
            }
            core.setOutput('matrix', JSON.stringify({ include }));

  run-ga:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run GA batch
        env:
          COLLECTION: ${{ matrix.collection }}
          COLLECTION_LABEL: ${{ matrix.collection_label }}
          BUDGET: ${{ matrix.budget }}
          SEED: ${{ matrix.seed }}
          GENERATIONS: ${{ inputs.generations }}
          POPULATION_SIZE: ${{ inputs.population_size }}
          MUTATION_RATE: ${{ inputs.mutation_rate }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          INSTANCE_OFFSET: ${{ inputs.instance_offset }}
        run: |
          set -euo pipefail
          SOURCE_DIR="datasets/${COLLECTION}"
          INPUT_DIR="${SOURCE_DIR}"
          if [[ "${MAX_INSTANCES}" != "0" ]]; then
            SUBSET_DIR="${RUNNER_TEMP}/${COLLECTION_LABEL}_offset${INSTANCE_OFFSET}_max${MAX_INSTANCES}"
            mkdir -p "${SUBSET_DIR}"
            SOURCE_DIR="${SOURCE_DIR}" SUBSET_DIR="${SUBSET_DIR}" MAX_INSTANCES="${MAX_INSTANCES}" INSTANCE_OFFSET="${INSTANCE_OFFSET}" python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source_dir = Path(os.environ["SOURCE_DIR"])
          subset_dir = Path(os.environ["SUBSET_DIR"])
          max_instances = int(os.environ["MAX_INSTANCES"])
          instance_offset = int(os.environ["INSTANCE_OFFSET"])
          if max_instances < 0:
              raise SystemExit("max_instances must be non-negative")
          if instance_offset < 0:
              raise SystemExit("instance_offset must be non-negative")

          files = sorted(path for path in source_dir.iterdir() if path.is_file() and not path.name.startswith("."))
          selected = files[instance_offset:instance_offset + max_instances]
          if not selected:
              raise SystemExit("No instances selected for this batch")
          for path in selected:
              shutil.copy2(path, subset_dir / path.name)
          print(f"Selected {len(selected)} instances from {source_dir} starting at offset {instance_offset}")
          PY
            INPUT_DIR="${SUBSET_DIR}"
          fi
          BUDGET_PADDED=$(printf "%03d" "${BUDGET}")
          MUTATION_LABEL=${MUTATION_RATE/./p}
          RUN_DIR="${COLLECTION_LABEL}_ga_budget${BUDGET_PADDED}_seed$(printf "%03d" "${SEED}")_g${GENERATIONS}_p${POPULATION_SIZE}_m${MUTATION_LABEL}"
          python3 approaches/genetic/index.py \
            --input "${INPUT_DIR}" \
            --output "results/${RUN_DIR}" \
            --metadata-output "results_metadata/genetic/${RUN_DIR}" \
            --budget "${BUDGET}" \
            --seed "${SEED}" \
            --generations "${GENERATIONS}" \
            --population-size "${POPULATION_SIZE}" \
            --mutation-rate "${MUTATION_RATE}"

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga-${{ matrix.collection_label }}-b${{ matrix.budget }}-seed${{ matrix.seed }}-offset${{ inputs.instance_offset }}-max${{ inputs.max_instances }}
          path: |
            results/
            results_metadata/genetic/
          if-no-files-found: error
          retention-days: 14
